# nfsu.conf for the container (compose.yaml mounts it). Differences from the
# sample in nfsuserver/: the log goes to "docker compose logs" only, without
# timestamps of its own, the admin secrets come from /run/secrets, and the
# JSON API listens on the compose network, where only Caddy (172.30.99.3, set
# in compose.yaml) reaches it; it is not published to the host.
#


# server name that players see in server lists
servername = Another cool server

# server network interface to listen [0.0.0.0 by default]
serverip =

# external server ip address, it's required to setup if NAT is enabled.
# players outside of the network of the server are given it for the server
# and for the players on its machine or in its private network
serverexternalip =

# user receive this text when join a channel [set empty to disable]
welcomemessage = 

# enable logging to file server.log [0|1]
enablelogfile = 0

# clear log file on every new server start [0|1]
rewritelogfile = 1

# send request to register server in public server list [0|1]
registerglobal = 0

# comma separated server lists (trackers) that registerglobal announces to,
# for example: trackers = nfsug.harpywar.com,http://nfs.onl
trackers =

# address the JSON API for the website listens on, port 10990 [empty to turn it off].
# Only a reverse proxy should reach it: keep 127.0.0.1 unless the proxy runs in
# another container
apiip = 0.0.0.0

# the reverse proxy in front of the JSON API: only its X-Real-IP header is believed
apiproxyip = 172.30.99.3

# TCP port that answers rank and track record requests for nfs.onl's network
# rankings (the infoserver protocol, 10880) [empty to turn it off]
statsport =

# comma separated infocentral lists that statsport is announced to every minute,
# for example: infocentral = nfs.onl:10881
infocentral =

# the website's admin login: a file with the crypt hash of the admin password
# (mkpasswd -m yescrypt) and a file with the base32 secret of the admin's
# authenticator app (head -c 20 /dev/urandom | base32). With the password file
# alone it runs in LAN mode: no code, and logins only from private addresses.
adminpasswordfile = /run/secrets/admin-password
admintotpfile = /run/secrets/admin-totp

# exclude timestamp in log, but keed only date [0|1]
disabletimestamp = 1

# enable debug logging [0|1]
verbose = 0

# enable server traffic logging in a separate file
logalltraffic = 0


# (different game clients are incompatible to play)
# do not allow users to connect with game version 1.1*
banv1 = 0

# do not allow users to connect with game version 1.2*
banv2 = 0

# do not allow users to connect with game version 1.3*
banv3 = 0

# do not allow users to connect with game version 1.4*
banv4 = 0

# do not allow users to create own rooms
banroomscreation = 0

# do not allow the cheater to enter the rooms
bancheater = 0

# comma separated room names for every game type
rooms_ranked_circuit = Global
rooms_ranked_sprint = Global
rooms_ranked_drift = Global
rooms_ranked_drag = Global
rooms_unranked_circuit = Global
rooms_unranked_sprint = Global
rooms_unranked_drift = Global
rooms_unranked_drag = Global
