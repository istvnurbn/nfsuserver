# The lobby server and its website: Caddy serves site/ with a Let's Encrypt
# certificate and passes /api/ on to the server. Setup: "Running the website"
# in README.md.

services:
  nfsuserver:
    build: .
    restart: unless-stopped
    labels:
      # built here: there is no newer image to pull
      com.centurylinklabs.watchtower.enable: "false"
    ports:
      - "10900:10900"
      - "10901:10901"
      - "10800:10800"
      - "10800:10800/udp"
      - "10980:10980"
      # - "10880:10880"   # with statsport = 10880 in docker/nfsu.conf (nfs.onl's rankings)
      # the JSON API (10990) stays on the web network, for Caddy only
    networks:
      - web
    volumes:
      - data:/data
      - ./docker/nfsu.conf:/data/nfsu.conf:ro
      - ./docker/news.txt:/data/news.txt:ro
    secrets:
      - admin-password
      - admin-totp

  web:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      web:
        # apiproxyip in docker/nfsu.conf: the only address whose X-Real-IP the server believes
        ipv4_address: 172.30.99.3
    environment:
      DOMAIN: ${DOMAIN:?put DOMAIN=your.domain in .env}
    volumes:
      - ./site:/srv:ro
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

# Its own network, so either container can restart without cutting off the
# other. Change the subnet if it clashes with one on the host, and the two
# addresses with it.
networks:
  web:
    ipam:
      config:
        - subnet: 172.30.99.0/24

secrets:
  admin-password:
    file: ./docker/admin-password
  admin-totp:
    file: ./docker/admin-totp

volumes:
  data:
  caddy-data:
  caddy-config:
